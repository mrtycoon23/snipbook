<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4a2aaa"/>
      <stop offset="100%" style="stop-color:#2d1b69"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>

  <!-- Scissors: left blade -->
  <line x1="156" y1="156" x2="272" y2="272" stroke="white" stroke-width="36" stroke-linecap="round"/>
  <circle cx="140" cy="140" r="44" fill="none" stroke="white" stroke-width="28"/>
  <circle cx="140" cy="140" r="16" fill="white" opacity="0.3"/>

  <!-- Scissors: right blade -->
  <line x1="356" y1="156" x2="240" y2="272" stroke="#c4b8f0" stroke-width="36" stroke-linecap="round"/>
  <circle cx="372" cy="140" r="44" fill="none" stroke="#c4b8f0" stroke-width="28"/>
  <circle cx="372" cy="140" r="16" fill="#c4b8f0" opacity="0.3"/>

  <!-- Handles -->
  <line x1="252" y1="284" x2="196" y2="368" stroke="white" stroke-width="30" stroke-linecap="round"/>
  <line x1="260" y1="284" x2="316" y2="368" stroke="#c4b8f0" stroke-width="30" stroke-linecap="round"/>
</svg>
